                },
                {

                        'Khi nhận được yêu cầu từ khách hàng về việc thay đổi giao diện hệ thống, bạn cần làm gì trước khi chấp nhận thay đổi này?',

                {

                    options: [
                        'Mô hình hóa giúp người quản lý dự án hiểu rõ về hệ thống',
                        'Mô hình hóa giúp lập trình viên hiểu rõ về hệ thống',
                        'Mô hình hóa giúp phân tích viên hiểu rõ các chức năng của hệ thống',
                        'Mô hình hóa giúp xây dựng tài liệu yêu cầu hệ thống',
                    ],
                    correctAnswer: 3,
                },
                {
                    id: 9114,
                    chapter: 99,
                    question: 'Đâu là phương án đúng trong các phương án sau đây về góc nhìn ca sử dụng trong mô hình hóa hướng đối tượng?',
                    options: [
                        'Quá trình xử lý dữ liệu trong hệ thống',
                        'Cấu trúc dữ liệu của hệ thống',
                        'Tương tác giữa hệ thống và các tác nhân',
                        'Cách thức triển khai hệ thống trên các kiến trúc vật lý',
                    ],
                    correctAnswer: 2,
                },
                {
                    id: 9115,
                    chapter: 99,
                    question:
                        'Câu hỏi hình ảnh: Cho biểu đồ quan hệ Entity - Deposit - Withdrawal (Hình 3). Hãy cho biết biểu đồ trên là loại biểu đồ nào sau đây?',
                    options: ['Biểu đồ quan hệ thực thể', 'Biểu đồ lớp', 'Biểu đồ luồng dữ liệu', 'Biểu đồ dữ liệu'],
                    correctAnswer: 0,
                    image: null,
                },
            ];

            // --- APP LOGIC ---
            const App = {
                data: {
                    questions: [],
                    view: 'home',
                    quiz: {
                        questions: [],
                        currentIndex: 0,
                        progress: [],
                        showResult: false,
                    },
                    admin: {
                        searchTerm: '',
                        editingId: null,
                        formData: {
                            question: '',
                            options: ['', '', '', ''],
                            correctAnswer: 0,
                            chapter: 1,
                            image: null,
                        },
                    },
                    filterChapter: 'all',
                    scrollPositions: {},
                },

                init() {
                    this.loadData();
                    this.setView('home');
                    this.render();
                },

                loadData() {
                    const saved = localStorage.getItem('nmcnpm_questions_js_v8');
                    if (saved) {
                        this.data.questions = JSON.parse(saved);
                    } else {
                        // Trong thực tế, bạn cần copy đầy đủ mảng IMPORTED_DATA vào đây
                        // Nếu bạn chạy file này độc lập, hãy đảm bảo IMPORTED_DATA ở trên chứa đủ >300 câu hỏi
                        if (typeof IMPORTED_DATA !== 'undefined') {
                            this.data.questions = [...IMPORTED_DATA];
                            this.saveData();
                        }
                    }
                },

                saveData() {
                    localStorage.setItem('nmcnpm_questions_js_v8', JSON.stringify(this.data.questions));
                },

                setView(viewName) {
                    this.data.view = viewName;
                    this.render();
                },

                // --- QUIZ FUNCTIONS ---

                startQuiz() {
                    let pool = [...this.data.questions];
                    if (this.data.filterChapter !== 'all') {
                        pool = pool.filter((q) => q.chapter == this.data.filterChapter);
                    }

                    if (pool.length === 0) {
                        this.showModal('Thông báo', 'Không có câu hỏi nào trong mục này!', () => {}, false);
                        return;
                    }

                    const shuffled = pool.sort(() => 0.5 - Math.random());
                    this.data.quiz.questions = shuffled;
                    this.data.quiz.progress = shuffled.map(() => ({
                        selectedOption: null,
                        isChecked: false,
                        isFlagged: false,
                    }));

                    this.data.quiz.currentIndex = 0;
                    this.data.quiz.showResult = false;
                    this.setView('quiz');
                },

                selectOption(optionIndex) {
                    const currentProgress = this.data.quiz.progress[this.data.quiz.currentIndex];
                    if (currentProgress.isChecked) return;

                    currentProgress.selectedOption = optionIndex;
                    this.render();
                },

                checkCurrentAnswer() {
                    const currentProgress = this.data.quiz.progress[this.data.quiz.currentIndex];
                    if (currentProgress.selectedOption === null) return;

                    currentProgress.isChecked = true;
                    this.render();
                },

                toggleFlag() {
                    const currentProgress = this.data.quiz.progress[this.data.quiz.currentIndex];
                    currentProgress.isFlagged = !currentProgress.isFlagged;
                    this.render();
                },

                jumpToQuestion(index) {
                    this.data.quiz.currentIndex = index;
                    this.render();
                },

                nextQuestion() {
                    if (this.data.quiz.currentIndex < this.data.quiz.questions.length - 1) {
                        this.data.quiz.currentIndex++;
                    } else {
                        this.finishQuiz();
                    }
                    this.render();
                },

                prevQuestion() {
                    if (this.data.quiz.currentIndex > 0) {
                        this.data.quiz.currentIndex--;
                        this.render();
                    }
                },

                finishQuiz() {
                    this.data.quiz.showResult = true;
                    this.render();
                },

                getScore() {
                    return this.data.quiz.progress.reduce((acc, p, idx) => {
                        const q = this.data.quiz.questions[idx];
                        return acc + (p.selectedOption === q.correctAnswer ? 1 : 0);
                    }, 0);
                },

                // --- ADMIN FUNCTIONS ---

                handleSearch(value) {
                    this.data.admin.searchTerm = value;
                    const listContainer = document.getElementById('admin-content-area');
                    if (listContainer) {
                        listContainer.innerHTML = this.getAdminListHTML();
                        lucide.createIcons();
                    }
                },

                handleImageUpload(event) {
                    const file = event.target.files[0];
                    if (file) {
                        if (file.size > 500000) {
                            this.showModal('Lỗi', 'Vui lòng chọn ảnh nhỏ hơn 500KB', () => {}, false);
                            return;
                        }

                        // CẬP NHẬT FORM DATA TRƯỚC KHI ĐỌC FILE
                        this.data.admin.formData.question = document.getElementById('form-q').value;
                        this.data.admin.formData.chapter = document.getElementById('form-c').value;
                        this.data.admin.formData.correctAnswer = document.getElementById('form-ca').value;
                        this.data.admin.formData.options[0] = document.getElementById('form-o0').value;
                        this.data.admin.formData.options[1] = document.getElementById('form-o1').value;
                        this.data.admin.formData.options[2] = document.getElementById('form-o2').value;
                        this.data.admin.formData.options[3] = document.getElementById('form-o3').value;

                        const reader = new FileReader();
                        reader.onloadend = () => {
                            this.data.admin.formData.image = reader.result;
                            this.render();
                        };
                        reader.readAsDataURL(file);
                    }
                },

                deleteQuestion(id) {
                    this.showModal(
                        'Xác nhận',
                        'Bạn có chắc chắn muốn xóa câu hỏi này?',
                        () => {
                            this.data.questions = this.data.questions.filter((q) => q.id !== id);
                            this.saveData();
                            this.handleSearch(this.data.admin.searchTerm);
                            const countSpan = document.getElementById('total-questions-count');
                            if (countSpan) countSpan.innerText = `Tổng: ${this.data.questions.length} câu`;
                        },
                        true,
                    );
                },

                editQuestion(question) {
                    this.data.admin.editingId = question.id;
                    this.data.admin.formData = {
                        question: question.question,
                        options: [...question.options],
                        correctAnswer: question.correctAnswer,
                        chapter: question.chapter || 1,
                        image: question.image || null,
                    };
                    this.render();
                },

                saveQuestion() {
                    const fd = this.data.admin.formData;
                    if (!fd.question || !fd.options[0]) {
                        this.showModal('Lỗi', 'Vui lòng nhập nội dung câu hỏi và các đáp án.', () => {}, false);
                        return;
                    }
                    const newQ = {
                        id: this.data.admin.editingId || Date.now(),
                        question: fd.question,
                        options: [...fd.options],
                        correctAnswer: parseInt(fd.correctAnswer),
                        chapter: parseInt(fd.chapter),
                        image: fd.image,
                    };
                    if (this.data.admin.editingId) {
                        this.data.questions = this.data.questions.map((q) => (q.id === this.data.admin.editingId ? newQ : q));
                    } else {
                        this.data.questions.push(newQ);
                    }
                    this.saveData();
                    this.resetForm();
                    this.render();
                },

                resetForm() {
                    this.data.admin.editingId = null;
                    this.data.admin.formData = { question: '', options: ['', '', '', ''], correctAnswer: 0, chapter: 1, image: null };
                },

                resetToDefault() {
                    this.showModal(
                        'Cảnh báo nguy hiểm',
                        'Thao tác này sẽ xóa mọi chỉnh sửa và khôi phục bộ câu hỏi gốc. Bạn có chắc không?',
                        () => {
                            if (typeof IMPORTED_DATA !== 'undefined') {
                                this.data.questions = [...IMPORTED_DATA];
                                this.saveData();
                                this.render();
                            }
                        },
                        true,
                    );
                },

                syncFormDataFromDOM() {
                    const q = document.getElementById('form-q');
                    if (!q) return;
                    this.data.admin.formData.question = q.value;
                    this.data.admin.formData.chapter = document.getElementById('form-c').value;
                    this.data.admin.formData.correctAnswer = document.getElementById('form-ca').value;
                    this.data.admin.formData.options[0] = document.getElementById('form-o0').value;
                    this.data.admin.formData.options[1] = document.getElementById('form-o1').value;
                    this.data.admin.formData.options[2] = document.getElementById('form-o2').value;
                    this.data.admin.formData.options[3] = document.getElementById('form-o3').value;
                },

                updateFormDataAndSave() {
                    this.syncFormDataFromDOM();
                    this.saveQuestion();
                },

                showModal(title, message, onConfirm, hasCancel = true) {
                    const modal = document.getElementById('custom-modal');
                    document.getElementById('modal-title').innerText = title;
                    document.getElementById('modal-message').innerText = message;
                    const cancelBtn = document.getElementById('modal-cancel');
                    const confirmBtn = document.getElementById('modal-confirm');
                    cancelBtn.style.display = hasCancel ? 'block' : 'none';

                    const newConfirm = confirmBtn.cloneNode(true);
                    const newCancel = cancelBtn.cloneNode(true);
                    confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
                    cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);

                    newConfirm.onclick = () => {
                        onConfirm();
                        modal.classList.add('hidden');
                        modal.classList.remove('flex');
                    };
                    newCancel.onclick = () => {
                        modal.classList.add('hidden');
                        modal.classList.remove('flex');
                    };
                    modal.classList.remove('hidden');
                    modal.classList.add('flex');
                },

                saveScrollState() {
                    const quizSidebar = document.getElementById('quiz-sidebar-scroll');
                    const quizMain = document.getElementById('quiz-main-scroll');
                    const adminList = document.getElementById('admin-content-area');

                    this.data.scrollPositions = {
                        quizSidebar: quizSidebar ? quizSidebar.scrollTop : 0,
                        quizMain: quizMain ? quizMain.scrollTop : 0,
                        adminList: adminList ? adminList.scrollTop : 0,
                    };
                },

                restoreScrollState() {
                    const quizSidebar = document.getElementById('quiz-sidebar-scroll');
                    const quizMain = document.getElementById('quiz-main-scroll');
                    const adminList = document.getElementById('admin-content-area');

                    if (quizSidebar && this.data.scrollPositions.quizSidebar) quizSidebar.scrollTop = this.data.scrollPositions.quizSidebar;
                    if (quizMain && this.data.scrollPositions.quizMain) quizMain.scrollTop = this.data.scrollPositions.quizMain;
                    if (adminList && this.data.scrollPositions.adminList) adminList.scrollTop = this.data.scrollPositions.adminList;
                },

                // --- RENDER ---

                render() {
                    this.saveScrollState();

                    const content = document.getElementById('app-content');
                    const navButtons = document.getElementById('nav-buttons');

                    if (this.data.view === 'home') {
                        navButtons.innerHTML = '';
                        const chapters = [...new Set(this.data.questions.map((q) => q.chapter))].sort((a, b) => a - b);
                        content.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full space-y-8 text-center fade-in overflow-y-auto">
                            <div class="space-y-4">
                                <h1 class="text-4xl font-bold text-blue-900">Ôn Thi NMCNPM Master</h1>
                                <p class="text-gray-600 max-w-md mx-auto">Ngân hàng câu hỏi trắc nghiệm đầy đủ. Hiện có <strong>${

                            </div>

                                <label class="block text-sm font-medium text-gray-700 mb-2">Chọn nội dung:</label>

                                    <option value="all" ${this.data.filterChapter === 'all' ? 'selected' : ''}>Tất cả các chương</option>
                                    ${chapters
                                        .map((c) => {
                                            let label = `Chương ${c}`;
                                            if (c == 99) label = 'Đề Giữa Kỳ & Hình ảnh';
                                            return `<option value="${c}" ${this.data.filterChapter == c ? 'selected' : ''}>${label}</option>`;

                                        .join('')}
                                </select>
                            </div>
                            <div class="flex flex-col sm:flex-row gap-4">
                                <button onclick="app.updateFilterAndStart()" class="px-8 py-4 bg-blue-600 text-white rounded-lg text-lg font-bold shadow-xl hover:bg-blue-700 transition transform hover:-translate-y-1 flex items-center gap-2"><i data-lucide="play"></i> Bắt đầu thi</button>
                                <button onclick="app.setView('admin')" class="px-8 py-4 bg-gray-100 text-gray-700 rounded-lg text-lg font-bold hover:bg-gray-200 transition flex items-center gap-2"><i data-lucide="settings"></i> Quản lý & Sửa</button>
                            </div>
                        </div>`;
                    } else if (this.data.view === 'quiz') {
                        navButtons.innerHTML = '';
                        this.renderQuiz(content);
                    } else if (this.data.view === 'admin') {
                        navButtons.innerHTML = '';
                        this.renderAdmin(content);
                    }

                    this.restoreScrollState();
                    lucide.createIcons();
                },

                updateFilterAndStart() {
                    const select = document.getElementById('chapter-select');
                    if (select) this.data.filterChapter = select.value;
                    this.startQuiz();
                },

                    const currentQ = quiz.questions[quiz.currentIndex];

                        const score = this.getScore();

                        <div class="flex flex-col items-center justify-center h-full fade-in">

                                <div class="flex justify-center gap-4 pt-4">

                                    <button onclick="app.setView('home')" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200">Về trang chủ</button>
                                </div>
                            </div>
                        </div>`;
                        return;
                    }

                    let sidebarHTML = '';
                    quiz.progress.forEach((p, idx) => {

                            bgClass = 'bg-blue-500 text-white border-blue-600';

                    container.innerHTML = `

                                <div class="question-grid">${sidebarHTML}</div>
                            </div>
                            <div class="p-4 border-t bg-gray-50 text-xs text-gray-500 space-y-1">
                                <div class="flex items-center gap-2"><div class="w-3 h-3 bg-white border border-gray-300 rounded"></div> Chưa làm</div>
                                <div class="flex items-center gap-2"><div class="w-3 h-3 bg-blue-500 rounded"></div> Đã chọn</div>
                                <div class="flex items-center gap-2"><div class="w-3 h-3 bg-green-500 rounded"></div> Đúng</div>
                                <div class="flex items-center gap-2"><div class="w-3 h-3 bg-red-500 rounded"></div> Sai</div>
                                <div class="flex items-center gap-2"><i data-lucide="flag" size="12" class="text-yellow-500" fill="currentColor"></i> Đã cắm cờ</div>

                            <div class="p-4 border-t">
                                <button onclick="app.finishQuiz()" class="w-full py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-900 transition font-medium">Nộp bài / Kết thúc</button>
                            </div>
                        </div>
                        <div class="lg:w-3/4 h-full flex flex-col order-1 lg:order-2">
                            <div class="flex justify-between items-center mb-4">

                                <div class="flex gap-2">

                                        <i data-lucide="flag" size="16" fill="${currentProgress.isFlagged ? 'currentColor' : 'none'}"></i>

                            <div id="quiz-main-scroll" class="flex-1 overflow-y-auto custom-scrollbar pr-2">
                                <div class="bg-white rounded-xl shadow-lg border border-gray-100 p-6 mb-6 flex flex-col gap-4">
                                    <div class="flex justify-between items-start mb-4">
                                        <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded uppercase tracking-wider">Câu ${
                                            quiz.currentIndex + 1

                                        <span class="text-xs text-gray-400">Chương ${currentQ.chapter}</span>
                                    </div>
                                    <h3 class="text-lg md:text-xl font-medium text-gray-800 leading-relaxed mb-4">${currentQ.question}</h3>
                                    ${
                                        currentQ.image
                                            ? `<div class="w-full flex justify-center py-4 bg-gray-50 rounded-lg border border-gray-100 mb-4"><img src="${currentQ.image}" class="max-h-80 max-w-full rounded shadow-sm object-contain"></div>`
                                            : ''
                                    }
                                </div>
                                <div class="grid grid-cols-1 gap-3 mb-20">
                                    ${currentQ.options
                                        .map((opt, idx) => {
                                            let classes =
                                                'p-4 rounded-xl border-2 cursor-pointer transition-all flex items-start gap-3 relative overflow-hidden ';
                                            let icon = '';
                                            if (currentProgress.isChecked) {
                                                if (idx === currentQ.correctAnswer) {
                                                    classes += 'bg-green-50 border-green-500 text-green-800 ring-1 ring-green-500';
                                                    icon = '<i data-lucide="check" class="text-green-600" size="20"></i>';
                                                } else if (idx === currentProgress.selectedOption) {
                                                    classes += 'bg-red-50 border-red-500 text-red-800';
                                                    icon = '<i data-lucide="x" class="text-red-600" size="20"></i>';
                                                } else {
                                                    classes += 'border-gray-200 opacity-60 bg-gray-50';
                                                }
                                            } else {
                                                if (currentProgress.selectedOption === idx) {
                                                    classes += 'border-blue-600 bg-blue-50 ring-1 ring-blue-600 shadow-md';
                                                } else {
                                                    classes += 'border-gray-200 hover:border-blue-300 hover:bg-gray-50 bg-white';
                                                }
                                            }
                                            const circleClass =
                                                currentProgress.selectedOption === idx ||
                                                (currentProgress.isChecked && idx === currentQ.correctAnswer)
                                                    ? 'border-current'
                                                    : 'border-gray-300';
                                            const dot =
                                                currentProgress.selectedOption === idx && !currentProgress.isChecked
                                                    ? '<div class="w-2.5 h-2.5 rounded-full bg-blue-600"></div>'
                                                    : '';
                                            return `<div onclick="app.selectOption(${idx})" class="${classes}"><div class="w-6 h-6 rounded-full border-2 flex-shrink-0 flex items-center justify-center mt-0.5 ${circleClass}">${dot}</div><div class="flex-1 text-sm md:text-base">${opt}</div>${icon}</div>`;
                                        })
                                        .join('')}
                                </div>
                            </div>
                            <div class="mt-4 flex justify-between items-center pt-4 border-t bg-gray-50 -mx-4 px-4 bottom-0 z-10 pb-4 md:pb-0 md:static md:bg-transparent md:border-t-0 md:p-0">
                                <button onclick="app.prevQuestion()" class="px-4 py-2 text-gray-600 hover:bg-gray-200 rounded-lg disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-2" ${
                                    quiz.currentIndex === 0 ? 'disabled' : ''
                                }><i data-lucide="chevron-left"></i> Trước</button>
                                ${
                                    !currentProgress.isChecked
                                        ? `<button onclick="app.checkCurrentAnswer()" ${
                                              currentProgress.selectedOption === null ? 'disabled' : ''
                                          } class="px-8 py-2.5 bg-blue-600 text-white rounded-lg font-bold shadow-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none transition transform active:scale-95">Kiểm tra</button>`
                                        : `<div class="text-sm font-bold ${
                                              currentProgress.selectedOption === currentQ.correctAnswer ? 'text-green-600' : 'text-red-600'
                                          }">${currentProgress.selectedOption === currentQ.correctAnswer ? 'Chính xác!' : 'Sai rồi!'}</div>`
                                }
                                <button onclick="app.nextQuestion()" class="px-4 py-2 text-gray-600 hover:bg-gray-200 rounded-lg flex items-center gap-2">${
                                    quiz.currentIndex === totalQ - 1 ? 'Kết thúc' : 'Sau'
                                } <i data-lucide="chevron-right"></i></button>
                            </div>
                        </div>
                    </div>`;
                },

                getAdminListHTML() {
                    const admin = this.data.admin;
                    const filteredQuestions = this.data.questions.filter((q) => q.question.toLowerCase().includes(admin.searchTerm.toLowerCase()));

                    let listHtml = filteredQuestions
                        .map(
                            (q, index) => `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-all group ${
                        admin.editingId === q.id ? 'ring-2 ring-blue-400' : ''
                    }">
                        <div class="flex justify-between items-start gap-4">
                            <div class="flex-1">
                                <div class="flex items-start gap-3 mb-2">
                                    <span class="bg-gray-100 text-gray-600 text-[10px] font-bold px-2 py-1 rounded mt-0.5 whitespace-nowrap">CH ${
                                        q.chapter
                                    }</span>
                                    <div>
                                        <p class="font-medium text-gray-800 text-sm">${q.question}</p>
                                        ${
                                            q.image
                                                ? `<div class="mt-1 inline-flex items-center gap-1 px-2 py-0.5 rounded bg-purple-50 text-purple-700 text-[10px] border border-purple-100"><i data-lucide="image" size="10"></i><span>Có ảnh</span></div>`
                                                : ''
                                        }
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-x-4 gap-y-1 mt-2 ml-11">
                                    ${q.options
                                        .map(
                                            (opt, i) => `
                                        <div class="text-[11px] p-1 rounded flex items-center gap-2 ${
                                            i === q.correctAnswer ? 'bg-green-50 text-green-700 font-medium ring-1 ring-green-200' : 'text-gray-500'
                                        }">
                                            <span class="w-3.5 h-3.5 rounded-full border flex items-center justify-center text-[9px] shrink-0 bg-white">${String.fromCharCode(
                                                65 + i,
                                            )}</span>
                                            <span class="truncate">${opt}</span>
                                        </div>
                                    `,
                                        )
                                        .join('')}
                                </div>
                            </div>
                            <div class="flex flex-col gap-1 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity">
                                <button onclick='app.editQuestion(${JSON.stringify(q).replace(
                                    /'/g,
                                    '&#39;',
                                )})' class="p-1.5 text-blue-600 hover:bg-blue-50 rounded-lg"><i data-lucide="edit" size="16"></i></button>
                                <button onclick="app.deleteQuestion(${
                                    q.id
                                })" class="p-1.5 text-red-600 hover:bg-red-50 rounded-lg"><i data-lucide="trash-2" size="16"></i></button>
                            </div>
                        </div>
                    </div>
                `,
                        )
                        .join('');

                    if (filteredQuestions.length === 0) {
                        listHtml = '<div class="text-center text-gray-400 py-8">Không tìm thấy câu hỏi nào.</div>';
                    }

                    return listHtml;
                },

                renderAdmin(container) {
                    const admin = this.data.admin;
                    const fd = admin.formData;

                    container.innerHTML = `
                    <div class="flex flex-col h-full fade-in">
                        <div class="mb-4 flex-none flex items-center justify-between">
                            <button onclick="app.setView('home')" class="text-gray-500 hover:text-blue-600 flex items-center gap-1 font-medium transition-colors">
                                <i data-lucide="arrow-left" size="20"></i> Quay lại trang chủ
                            </button>
                            <h2 class="text-2xl font-bold text-gray-800">Quản lý ngân hàng câu hỏi</h2>
                        </div>
                        
                        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1 min-h-0">
                            <!-- FORM COLUMN -->
                            <div class="lg:col-span-4 h-full flex flex-col min-h-0">
                                <div class="flex-1 overflow-y-auto custom-scrollbar pr-1 pb-2">
                                    <div class="bg-white rounded-xl shadow-lg p-6 border border-blue-100">
                                        <h3 class="text-lg font-bold mb-4 flex items-center gap-2 text-blue-800"><i data-lucide="${
                                            admin.editingId ? 'edit' : 'plus'
                                        }"></i> ${admin.editingId ? 'Sửa câu hỏi' : 'Thêm câu mới'}</h3>
                                        <div class="space-y-4">
                                            <textarea id="form-q" class="w-full p-3 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" rows="3" placeholder="Nhập nội dung...">${
                                                fd.question
                                            }</textarea>
                                            <div class="grid grid-cols-2 gap-2">
                                                <div><label class="text-xs font-bold text-gray-500 uppercase">Chương</label><input type="number" id="form-c" class="w-full p-2 border rounded-lg text-sm" value="${
                                                    fd.chapter
                                                }"></div>
                                                <div><label class="text-xs font-bold text-gray-500 uppercase">Đáp án đúng</label><select id="form-ca" class="w-full p-2 border rounded-lg text-sm bg-white">${[
                                                    0, 1, 2, 3,
                                                ]
                                                    .map(
                                                        (i) =>
                                                            `<option value="${i}" ${fd.correctAnswer === i ? 'selected' : ''}>${String.fromCharCode(
                                                                65 + i,
                                                            )}</option>`,
                                                    )
                                                    .join('')}</select></div>
                                            </div>
                                            <div>
                                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Ảnh minh họa</label>
                                                <div class="flex items-center gap-2">
                                                    <label class="flex-1 cursor-pointer bg-gray-50 border border-dashed border-gray-300 rounded-lg p-2 text-center hover:bg-gray-100 transition">
                                                        <input type="file" class="hidden" accept="image/*" onchange="app.handleImageUpload(event)">
                                                        <div class="flex items-center justify-center gap-2 text-sm text-gray-600"><i data-lucide="upload" size="16"></i> ${
                                                            fd.image ? 'Thay ảnh' : 'Tải ảnh'
                                                        }</div>
                                                    </label>
                                                    ${
                                                        fd.image
                                                            ? `<button onclick="app.data.admin.formData.image = null; app.render();" class="p-2 text-red-500 hover:bg-red-50 rounded-lg"><i data-lucide="trash-2" size="16"></i></button>`
                                                            : ''
                                                    }
                                                </div>
                                                ${
                                                    fd.image
                                                        ? `<img src="${fd.image}" class="mt-2 h-16 w-auto rounded border bg-gray-50 object-contain mx-auto">`
                                                        : ''
                                                }
                                            </div>
                                            <div class="space-y-2">
                                                ${[0, 1, 2, 3]
                                                    .map(
                                                        (i) =>
                                                            `<div class="relative"><span class="absolute left-3 top-2.5 text-gray-400 text-xs font-bold">${String.fromCharCode(
                                                                65 + i,
                                                            )}</span><input id="form-o${i}" class="w-full pl-8 p-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" value="${
                                                                fd.options[i]
                                                            }" placeholder="Đáp án ${String.fromCharCode(65 + i)}..."></div>`,
                                                    )
                                                    .join('')}
                                            </div>
                                            <div class="pt-2 flex gap-2">
                                                <button onclick="app.updateFormDataAndSave()" class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex justify-center items-center gap-2"><i data-lucide="save" size="16"></i> ${
                                                    admin.editingId ? 'Cập nhật' : 'Lưu lại'
                                                }</button>
                                                ${
                                                    admin.editingId
                                                        ? `<button onclick="app.resetForm(); app.render();" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200">Hủy</button>`
                                                        : ''
                                                }
                                            </div>
                                        </div>
                                        <div class="mt-4 pt-4 border-t text-center"><button onclick="app.resetToDefault()" class="text-xs text-red-400 hover:text-red-600 hover:underline">⚠ Khôi phục dữ liệu gốc</button></div>
                                    </div>
                                    <div class="h-10"></div>
                                </div>
                            </div>

                            <!-- LIST COLUMN -->
                            <div class="lg:col-span-8 h-full flex flex-col min-h-0 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                                <div class="flex-none p-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                                    <div class="flex items-center gap-4 w-full">
                                        <span class="font-semibold text-blue-800 whitespace-nowrap">Tổng: ${this.data.questions.length} câu</span>
                                        <div class="relative w-full max-w-xs">
                                            <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" size="16"></i>
                                            <input class="pl-9 p-1.5 rounded border border-blue-200 text-sm w-full outline-none focus:border-blue-500" placeholder="Tìm kiếm..." value="${
                                                admin.searchTerm
                                            }" oninput="app.handleSearch(this.value)">
                                        </div>
                                    </div>
                                </div>
                                <div id="admin-content-area" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar">
                                    ${this.getAdminListHTML()}
                                </div>
                            </div>
                        </div>
                    </div>`;
                },

                // ... (Giữ nguyên updateFormDataAndSave)
                updateFormDataAndSave() {
                    this.syncFormDataFromDOM();
                    this.saveQuestion();
                },
            };

            const app = Object.create(App);
            app.data = JSON.parse(JSON.stringify(App.data));
            window.app = app;
            app.init();
        </script>
    </body>
</html>
